name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app + DMG
        run: ./scripts/build_app.sh
      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: macslator-*.dmg